name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个 PR 上多个 commit 取消旧的运行，避免浪费 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires-python = ">=3.10"
        # 测最新 3 个小版本，最常见的兼容性组合
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 uv action：会自动启用 uv 缓存（基于 uv.lock 哈希）
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # 缓存到 ~/.cache/uv 与 GitHub Actions Cache
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}

      # --frozen：严格按 uv.lock 安装，CI 必须用
      # --all-groups：包括 [dependency-groups].dev 里的 httpx
      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Verify installed packages
        run: uv pip list

      - name: Run smoke tests
        # smoke test 自带 fake QiniuClient，不需要真实七牛云凭据
        run: uv run python -m tests.test_smoke

      - name: Validate pyproject.toml
        run: uv lock --check

  # Docker 构建验证：仅 build 不 push，确保 Dockerfile 在干净环境也能跑
  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: git-lfs-py-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
