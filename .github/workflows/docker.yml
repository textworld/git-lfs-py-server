name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Tag suffix (e.g. 'rc1', 'beta')"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read       # 读 checkout
      packages: write      # 推送到 GHCR
      id-token: write      # 启用 provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多架构构建需要 QEMU 模拟非原生架构
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR 不登录（不推送），主线/标签才登录
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动从 git ref 推导 tag：
      #   main 分支 → :main, :main-<sha>, :latest
      #   PR        → :pr-<num>
      #   v1.2.3    → :1.2.3, :1.2, :latest（如果是仓库中最新 tag）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # provenance attestation（SLSA 来源证明）
          provenance: true
          # SBOM（软件物料清单）
          sbom: true
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag_suffix }},enable=${{ inputs.tag_suffix != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 多架构：x86_64 + arm64
          platforms: linux/amd64,linux/arm64
          # PR 不推送，只构建验证
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # GitHub Actions Cache 缓存镜像层
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 生成 provenance attestation + SBOM attestation
          # （由 docker/build-push-action 控制，而不是通过 outputs:）
          provenance: true
          sbom: true

  # 可选：镜像漏洞扫描（默认 disabled，需要 trivy-action 依赖的网络可达）
