[project]
name = "git-lfs-py-server"
version = "0.1.0"
description = "A lightweight Git LFS server backed by Qiniu Cloud Object Storage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "textworld", email = "you@example.com" },
]
keywords = ["git-lfs", "fastapi", "qiniu", "object-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT license",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "qiniu==7.13.1",
    "requests==2.32.3",
    "python-multipart==0.0.20",
]

# PEP 735 开发依赖分组：uv sync --group dev 安装
[dependency-groups]
dev = [
    "httpx>=0.27",  # FastAPI TestClient / 异步 HTTP 测试
]

[tool.uv]
# 纯应用，不打包成 wheel（不像库那样需要 pip install）
package = false
# 锁定 Python 解释器到 3.12，避免不同机器装出不同小版本
# 想要更宽范围可改成 ">=3.10,<3.14"
python-preference = "managed"
# 默认同步 dev 组（等同 uv sync --all-groups）
default-groups = ["dev"]
